<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Panel</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { background: transparent; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h1 { font-size: 1.25rem; color: #38bdf8; text-align: center; margin-bottom: 6px; }
    .subtext { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-bottom: 20px; }
    .hidden { display: none; }
    
    .nav-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .item-box { background: #334155; padding: 16px 10px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; border: 1px solid #475569; font-size: 0.85rem; }
    .item-box:hover { background: #38bdf8; color: #0f172a; transform: translateY(-2px); }
    
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-content { background: #1e293b; padding: 22px; border-radius: 14px; width: 100%; max-width: 400px; border: 1px solid #475569; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
    input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin: 10px 0; outline: none; font-size: 0.9rem; }
    textarea { resize: vertical; min-height: 80px; }
    
    .btn-main { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #0284c7; color: white; cursor: pointer; font-weight: bold; margin-top: 6px; }
    .btn-main:hover { background: #0369a1; }
    .btn-sec { width: 100%; padding: 9px; border: 1px solid #475569; border-radius: 8px; background: transparent; color: #94a3b8; cursor: pointer; margin-top: 8px; }
    .btn-sec:hover { background: #334155; color: white; }
    .btn-logout { width: 100%; margin-top: 18px; padding: 10px; background: none; border: 1px solid #475569; color: #94a3b8; cursor: pointer; border-radius: 8px; }
    .btn-logout:hover { background: #334155; }
    
    .result-box { background: #0f172a; border-radius: 8px; padding: 12px; margin-top: 12px; text-align: left; font-size: 0.85rem; color: #cbd5e1; max-height: 140px; overflow-y: auto; border: 1px solid #334155; display: none; }
  </style>
</head>
<body>

  <!-- ส่วนล็อกอิน -->
  <div id="login-box" class="card">
    <h1>เข้าสู่ระบบแผงควบคุม</h1>
    <p class="subtext">กรุณากรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
    <input type="password" id="passInput" placeholder="รหัสผ่าน" onkeypress="if(event.key==='Enter') checkPass()" />
    <button class="btn-main" onclick="checkPass()">เข้าสู่ระบบ</button>
  </div>

  <!-- ส่วนแผงควบคุม -->
  <div id="dashboard-box" class="card hidden">
    <h1>แผงควบคุมหลัก (Control Panel)</h1>
    <p class="subtext">ยินดีต้อนรับสู่ระบบจัดการ theloydas.com</p>
    
    <div class="nav-box">
      <div class="item-box" onclick="openTtsModal()">🗣️ ทดสอบเสียง TTS</div>
      <div class="item-box" onclick="openApiModal()">🔗 เชื่อมต่อ API</div>
      <div class="item-box" onclick="window.open('https://github.com/tom-nz/Thai-Tone-TTS-Project', '_blank')">📁 คลังโปรเจกต์</div>
      <div class="item-box" onclick="window.open('https://dash.cloudflare.com', '_blank')">📊 สถานะ Cloudflare</div>
    </div>
    <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
  </div>

  <!-- Modal Popup -->
  <div id="modal" class="modal">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <script>
    const SECRET_KEY = "AdminPass1234";

    function checkPass() {
      if(document.getElementById("passInput").value === SECRET_KEY) {
        sessionStorage.setItem("auth", "true");
        location.reload();
      } else {
        alert("รหัสผ่านไม่ถูกต้อง!");
      }
    }
    
    if (sessionStorage.getItem("auth") === "true") {
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("dashboard-box").classList.remove("hidden");
    }

    // Modal: จัดการ API Key
    function openApiModal() {
      const currentKey = localStorage.getItem("gemini_api_key") || "";
      const statusText = currentKey ? "🟢 มีการบันทึก Key ในเครื่องแล้ว" : "⚪ ยังไม่ได้ตั้งค่า Key";
      
      showModal(`
        <h3 style="color:#38bdf8; margin-bottom:6px;">ตั้งค่า Gemini API Key</h3>
        <p style="color:#94a3b8; font-size:0.75rem; margin-bottom:10px;">${statusText}</p>
        <input type="password" id="apiKeyInput" placeholder="วาง API Key ที่นี่..." value="${currentKey}">
        <button class="btn-main" onclick="saveApiKey()">บันทึกคีย์</button>
        <button class="btn-sec" onclick="closeModal()">ปิด</button>
      `);
    }

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) {
        alert("กรุณาวาง API Key");
        return;
      }
      localStorage.setItem("gemini_api_key", key);
      alert("บันทึก API Key สำเร็จ!");
      closeModal();
    }

    // Modal: ทดสอบเสียงและผันวรรณยุกต์
    function openTtsModal() {
      showModal(`
        <h3 style="color:#38bdf8; margin-bottom:6px;">ทดสอบสังเคราะห์เสียง (TTS)</h3>
        <p style="color:#94a3b8; font-size:0.75rem; margin-bottom:10px;">พิมพ์คำภาษาไทยเพื่อทดสอบระบบเสียง</p>
        <textarea id="ttsTextInput" placeholder="พิมพ์คำหรือประโยค เช่น กา ก่า ก้า ก๊า ก๋า..."></textarea>
        <div style="display:flex; gap:8px;">
          <button class="btn-main" onclick="playVoice()" style="background:#059669;">🔊 กดฟังเสียง</button>
          <button class="btn-main" onclick="analyzeToneWithGemini()">🤖 AI วิเคราะห์คำ</button>
        </div>
        <div id="aiResult" class="result-box"></div>
        <button class="btn-sec" onclick="closeModal()">ปิด</button>
      `);
    }

    // ระบบเล่นเสียงภาษาไทยตรงจาก Google TTS Audio
    function playVoice() {
      const text = document.getElementById("ttsTextInput").value.trim();
      if (!text) {
        alert("กรุณากรอกข้อความก่อนกดฟังเสียง");
        return;
      }

      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q=${encodeURIComponent(text)}`;
      const audio = new Audio(audioUrl);
      
      audio.play().catch(() => {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "th-TH";
        window.speechSynthesis.speak(utterance);
      });
    }

    // ระบบส่งข้อความวิเคราะห์วรรณยุกต์ผ่าน Gemini API
    async function analyzeToneWithGemini() {
      const apiKey = localStorage.getItem("gemini_api_key");
      const text = document.getElementById("ttsTextInput").value.trim();
      const resBox = document.getElementById("aiResult");

      if (!apiKey) {
        alert("กรุณาไปที่เมนู 'เชื่อมต่อ API' เพื่อตั้งค่า Key ก่อนครับ");
        return;
      }
      if (!text) {
        alert("กรุณากรอกข้อความที่ต้องการวิเคราะห์");
        return;
      }

      resBox.style.display = "block";
      resBox.innerHTML = "⏳ กำลังส่งคำให้ AI วิเคราะห์...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `ช่วยวิเคราะห์คำภาษาไทยนี้: "${text}" โดยบอก:\n1. พยัญชนะต้นและหมู่อักษร (สูง/กลาง/ต่ำ)\n2. รูปและเสียงวรรณยุกต์\n3. คำอ่านสะกดเสียง สรุปสั้นๆ กระชับ`
              }]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const aiText = data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>');
          resBox.innerHTML = `<strong>ผลการวิเคราะห์:</strong><br>${aiText}`;
        } else {
          resBox.innerHTML = "❌ ไม่สามารถประมวลผลได้ ตรวจสอบ API Key";
        }
      } catch (err) {
        resBox.innerHTML = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย";
      }
    }

    function showModal(html) {
      document.getElementById("modal").style.display = "flex";
      document.getElementById("modal-content").innerHTML = html;
    }
    
    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
    
    function logout() {
      sessionStorage.removeItem("auth");
      location.reload();
    }
  </script>
</body>
</html>
