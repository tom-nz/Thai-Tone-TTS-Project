<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Panel</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: transparent; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 460px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h1 { font-size: 1.35rem; color: #38bdf8; text-align: center; margin-bottom: 6px; }
    .subtext { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 18px; }
    .hidden { display: none; }
    input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 12px; font-size: 0.95rem; outline: none; }
    input[type="password"]:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .error-msg { color: #f87171; font-size: 0.8rem; margin-bottom: 10px; display: none; text-align: center; }
    .nav-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .item-box { background: #334155; padding: 14px 10px; border-radius: 8px; text-align: center; color: #e2e8f0; font-size: 0.85rem; font-weight: 500; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; }
    .item-box:hover { border-color: #38bdf8; background: #3b4d66; }
    .btn-logout { margin-top: 18px; background: #475569; }
    .btn-logout:hover { background: #334155; }
  </style>
</head>
<body>

  <!-- กล่องกรอกรหัสผ่าน -->
  <div id="login-box" class="card">
    <h1>เข้าสู่ระบบแผงควบคุม</h1>
    <p class="subtext">กรุณากรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
    <div id="error" class="error-msg">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</div>
    <input type="password" id="passInput" placeholder="รหัสผ่าน" onkeypress="if(event.key==='Enter') checkPass()" />
    <button onclick="checkPass()">เข้าสู่ระบบ</button>
  </div>

  <!-- หน้าแดชบอร์ดหลัก -->
  <div id="dashboard-box" class="card hidden">
    <h1>แผงควบคุมหลัก (Control Panel)</h1>
    <p class="subtext">ยินดีต้อนรับเข้าสู่ระบบจัดการ theloydas.com</p>
    
    <div class="nav-box">
      <div class="item-box">⚙️ จัดการระบบ</div>
      <div class="item-box">📊 สถานะ Cloudflare</div>
      <div class="item-box">📁 คลังโปรเจกต์</div>
      <div class="item-box">🔗 เชื่อมต่อ API</div>
    </div>

    <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
  </div>

  <script>
    const SECRET_KEY = "AdminPass1234";

    function checkPass() {
      const input = document.getElementById("passInput").value;
      if (input === SECRET_KEY) {
        sessionStorage.setItem("auth_logged_in", "true");
        showDashboard();
      } else {
        document.getElementById("error").style.display = "block";
      }
    }

    function showDashboard() {
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("dashboard-box").classList.remove("hidden");
    }

    function logout() {
      sessionStorage.removeItem("auth_logged_in");
      location.reload();
    }

    if (sessionStorage.getItem("auth_logged_in") === "true") {
      showDashboard();
    }
  </script>
</body>
</html>
