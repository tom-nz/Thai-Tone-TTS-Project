<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Tone TTS Research & Analysis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 flex flex-col gap-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
      <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
        <span>🔊</span> ทดสอบสังเคราะห์เสียง (TTS)
      </h1>
      <span id="modelBadge" class="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-1 rounded">Auto Detect</span>
    </div>

    <!-- API Key Input -->
    <div class="flex flex-col gap-1">
      <label class="text-xs text-slate-400">Gemini API Key:</label>
      <input 
        type="password" 
        id="apiKeyInput" 
        placeholder="วาง Google AI Studio API Key ที่นี่..." 
        class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition"
      />
    </div>

    <!-- Text Input Area -->
    <div class="flex flex-col gap-1">
      <label class="text-xs text-slate-400">ข้อความภาษาไทยที่ต้องการทดสอบ:</label>
      <textarea 
        id="textInput" 
        rows="3" 
        placeholder="พิมพ์คำหรือประโยค เช่น กา, ข่า, ค้า..." 
        class="bg-slate-900 border border-slate-700 rounded-lg p-3 text-base text-slate-100 focus:outline-none focus:border-cyan-500 transition resize-none"
      >กา</textarea>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button 
        id="btnPlay" 
        onclick="playCarrierTone()" 
        class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg transition"
      >
        <span>📢</span> กดฟังเสียง
      </button>

      <button 
        id="btnAnalyze" 
        onclick="handleAnalyze()" 
        class="flex items-center justify-center gap-2 bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg transition"
      >
        <span>🤖</span> AI วิเคราะห์คำ
      </button>
    </div>

    <!-- Result / Status Box -->
    <div id="resBox" class="hidden rounded-xl p-4 text-sm transition-all border leading-relaxed overflow-x-auto"></div>

    <!-- Close Button -->
    <button 
      id="btnClose" 
      onclick="resetResult()" 
      class="hidden w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-lg text-sm transition"
    >
      ปิด
    </button>
  </div>

  <script>
    // 1. บันทึกและดึง API Key จาก LocalStorage
    const apiKeyInput = document.getElementById('apiKeyInput');
    const savedKey = localStorage.getItem('GEMINI_API_KEY');
    if (savedKey) apiKeyInput.value = savedKey;

    apiKeyInput.addEventListener('input', (e) => {
      localStorage.setItem('GEMINI_API_KEY', e.target.value.trim());
    });

    // 2. วิเคราะห์สัทศาสตร์ด้วย Gemini พร้อมระบบ Auto-Fallback Endpoint
    async function handleAnalyze() {
      const text = document.getElementById('textInput').value.trim();
      const key = apiKeyInput.value.trim();
      const badge = document.getElementById('modelBadge');

      if (!text) {
        showStatus('กรุณาพิมพ์ข้อความที่ต้องการวิเคราะห์', 'error');
        return;
      }
      if (!key) {
        showStatus('กรุณากรอก Gemini API Key ก่อนเริ่มวิเคราะห์', 'error');
        return;
      }

      showStatus('กำลังเชื่อมต่อ AI เพื่อวิเคราะห์ข้อมูลทางสัทศาสตร์...', 'loading');

      const prompt = `วิเคราะห์โครงสร้างทางสัทศาสตร์ภาษาไทยสำหรับงานวิจัย TTS:
คำ/ประโยค: "${text}"
กรุณาระบุรายละเอียดเป็นข้อๆ:
1. ไตรยางศ์ (อักษร สูง/กลาง/ต่ำ)
2. โครงสร้างคำเป็น/คำตาย และความยาวสระ
3. เสียงวรรณยุกต์ (สามัญ/เอก/โท/ตรี/จัตวา)
4. การประมาณค่า Target Pitch Contour (Hz หรือ Semitone)`;

      // ลำดับ URL และ Model ที่ระบบจะทดสอบเชื่อมต่ออัตโนมัติ
      const candidateEndpoints = [
        { name: "v1beta/gemini-1.5-flash-latest", url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent" },
        { name: "v1/gemini-1.5-flash", url: "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent" },
        { name: "v1beta/gemini-1.5-flash", url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent" },
        { name: "v1beta/gemini-pro", url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent" },
        { name: "v1beta/gemini-1.5-pro-latest", url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro-latest:generateContent" }
      ];

      let lastError = null;

      for (const item of candidateEndpoints) {
        try {
          const endpointUrl = `${item.url}?key=${key}`;
          const response = await fetch(endpointUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const data = await response.json();

          if (data.error) {
            lastError = data.error.message;
            continue; // ข้ามไปลอง Endpoint ตัวถัดไป
          }

          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (reply) {
            badge.innerText = item.name.split('/')[1];
            showStatus(reply.replace(/\n/g, '<br>'), 'success');
            return;
          }
        } catch (err) {
          lastError = err.message;
        }
      }

      showStatus(`❌ ข้อผิดพลาด: ${lastError || 'ไม่สามารถเชื่อมต่อได้ ตรวจสอบความถูกต้องของ API Key'}`, 'error');
    }

    // 3. จำลองเสียงสัญญาณพาหะอ้างอิง (Carrier Wave F0)
    function playCarrierTone() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      // ความถี่ F0 อ้างอิงเสียงพูดปกติ (ประมาณ C4 = 261.63 Hz)
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(261.63, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    // 4. แสดงผลลัพธ์บน UI
    function showStatus(htmlContent, type) {
      const resBox = document.getElementById('resBox');
      const btnClose = document.getElementById('btnClose');
      
      resBox.className = "rounded-xl p-4 text-sm transition-all border leading-relaxed overflow-x-auto";

      if (type === 'error') {
        resBox.classList.add('bg-red-950/80', 'border-red-800', 'text-red-200');
      } else if (type === 'success') {
        resBox.classList.add('bg-slate-900', 'border-cyan-800', 'text-slate-100');
      } else {
        resBox.classList.add('bg-slate-900', 'border-slate-700', 'text-amber-300');
      }

      resBox.innerHTML = htmlContent;
      resBox.classList.remove('hidden');
      btnClose.classList.remove('hidden');
    }

    function resetResult() {
      document.getElementById('resBox').classList.add('hidden');
      document.getElementById('btnClose').classList.add('hidden');
    }
  </script>
</body>
</html>
