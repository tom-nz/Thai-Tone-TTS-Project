<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Tone Complete 5-Tone Synthesizer & Staff</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- VexFlow Library -->
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    #staffCanvas svg {
      margin: 0 auto;
      background: #090d16;
      border-radius: 1rem;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6 flex flex-col gap-5">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">🎼</span>
        <h1 class="text-lg md:text-xl font-bold text-cyan-400">Thai 5-Tone Synthesizer & Musical Staff</h1>
      </div>
      <span class="text-xs bg-cyan-950/90 text-cyan-300 border border-cyan-800/80 px-2.5 py-1 rounded-full font-mono">Full 5 Tones</span>
    </div>

    <!-- Text Input Area -->
    <div class="flex flex-col gap-1.5">
      <label class="text-xs text-slate-400 font-medium">พิมพ์พยางค์หรือคำต้นแบบ (เช่น กา, มา, คา, ปา):</label>
      <div class="flex gap-2">
        <input 
          type="text" 
          id="textInput" 
          placeholder="พิมพ์คำ เช่น กา, มอ, ปา..." 
          class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-base text-slate-100 focus:outline-none focus:border-cyan-500 transition font-medium"
          value="มอ"
        />
        <button 
          onclick="handleAnalyzeAll()" 
          class="bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white font-semibold px-5 py-2.5 rounded-xl shadow-lg transition flex items-center gap-1.5"
        >
          <span>⚡</span> วิเคราะห์ 5 เสียง
        </button>
      </div>
    </div>

    <!-- Phonetic Profile Info -->
    <div id="profileBox" class="hidden grid grid-cols-3 gap-2 bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs md:text-sm"></div>

    <!-- Musical Staff Container -->
    <div id="staffSection" class="hidden flex flex-col gap-3 bg-slate-950 border border-slate-800 rounded-2xl p-4">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <span class="text-xs text-slate-400 font-semibold tracking-wide uppercase">บรรทัด 5 เส้น กุญแจซอล (ลำดับเสียง: สามัญ - เอก - โท - ตรี - จัตวา)</span>
        <button 
          onclick="playSequence()" 
          class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition"
        >
          <span>▶️</span> เล่นไล่ 5 เสียงรวดเดียว
        </button>
      </div>
      
      <!-- Staff Render Target -->
      <div id="staffCanvas" class="w-full overflow-x-auto flex justify-center py-2"></div>
    </div>

    <!-- 5 Tone Grid Player -->
    <div id="toneGrid" class="hidden grid grid-cols-5 gap-2"></div>

  </div>

  <script>
    const VF = Vex.Flow;

    const HIGH_CLASS = new Set(["ข","ฃ","ฉ","ฐ","ถ","ผ","ฝ","ศ","ษ","ส","ห"]);
    const MID_CLASS = new Set(["ก","จ","ด","ต","บ","ป","อ","ฎ","ฏ"]);
    const LOW_CLASS = new Set(["ค","ฅ","ฆ","ง","ช","ซ","ฌ","ญ","ฑ","ฒ","ณ","ท","ธ","น","พ","ฟ","ภ","ม","ย","ร","ล","ว","ฬ","ฮ"]);

    // ข้อมูล Formant สระภาษาไทยพื้นฐาน (F1, F2 ในหน่วย Hz)
    const VOWEL_FORMANTS = {
      "า": { f1: 750, f2: 1200 },
      "อ": { f1: 550, f2: 850 },
      "ี": { f1: 280, f2: 2250 },
      "ู": { f1: 320, f2: 800 },
      "default": { f1: 600, f2: 1100 }
    };

    // โปรไฟล์มาตรฐานของ 5 วรรณยุกต์ไทย
    const TONE_SPECS = [
      { name: "สามัญ", thaiTone: "สามัญ", noteKey: "c/4", startFreq: 261.63, endFreq: 261.63, contour: "Level (กลาง)" },
      { name: "เอก", thaiTone: "เอก", noteKey: "b/3", startFreq: 246.94, endFreq: 220.00, contour: "Low-Falling (ต่ำ-กดลง)" },
      { name: "โท", thaiTone: "โท", noteKey: "e/4", startFreq: 329.63, endFreq: 220.00, contour: "High-Falling (สูง-ตก)" },
      { name: "ตรี", thaiTone: "ตรี", noteKey: "g/4", startFreq: 392.00, endFreq: 392.00, contour: "High (สูงลอย)" },
      { name: "จัตวา", thaiTone: "จัตวา", noteKey: "d/4", startFreq: 220.00, endFreq: 293.66, contour: "Rising (ต่ำ-ช้อนขึ้น)" }
    ];

    let currentAnalysis = null;

    function extractPhonetics(word) {
      let initial = "ก";
      let vowelKey = "default";

      for (const ch of word) {
        if (HIGH_CLASS.has(ch) || MID_CLASS.has(ch) || LOW_CLASS.has(ch)) {
          initial = ch;
          break;
        }
      }

      for (const [vk, _] of Object.entries(VOWEL_FORMANTS)) {
        if (word.includes(vk)) {
          vowelKey = vk;
          break;
        }
      }

      let consonantClass = "อักษรกลาง";
      if (HIGH_CLASS.has(initial)) consonantClass = "อักษรสูง";
      else if (LOW_CLASS.has(initial)) consonantClass = "อักษรต่ำ";

      return { initial, consonantClass, vowelKey, formants: VOWEL_FORMANTS[vowelKey] };
    }

    function renderStaff5Tones() {
      const container = document.getElementById("staffCanvas");
      container.innerHTML = "";

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(480, 140);
      const context = renderer.getContext();
      context.setFont("Arial", 9, "").setBackgroundFillStyle("#090d16");

      const stave = new VF.Stave(10, 10, 460);
      stave.addClef("treble").addTimeSignature("5/4");
      stave.setContext(context).draw();

      const staveNotes = TONE_SPECS.map(t => {
        const note = new VF.StaveNote({ clef: "treble", keys: [t.noteKey], duration: "q" });
        note.setStyle({ fillStyle: "#22d3ee", strokeStyle: "#22d3ee" });
        return note;
      });

      const voice = new VF.Voice({ num_beats: 5, beat_value: 4 });
      voice.addTickables(staveNotes);

      new VF.Formatter().joinVoices([voice]).format([voice], 360);
      voice.draw(context, stave);
    }

    function handleAnalyzeAll() {
      const text = document.getElementById('textInput').value.trim();
      if (!text) return;

      currentAnalysis = extractPhonetics(text);

      const profileBox = document.getElementById('profileBox');
      const staffSection = document.getElementById('staffSection');
      const toneGrid = document.getElementById('toneGrid');

      profileBox.innerHTML = `
        <div><span class="text-slate-400">พยัญชนะต้น:</span> <strong class="text-cyan-300">${currentAnalysis.initial} (${currentAnalysis.consonantClass})</strong></div>
        <div><span class="text-slate-400">สระที่ตรวจจับ:</span> <strong class="text-amber-300">${currentAnalysis.vowelKey}</strong></div>
        <div><span class="text-slate-400">Formants:</span> <span class="font-mono text-emerald-400">F1:${currentAnalysis.formants.f1} / F2:${currentAnalysis.formants.f2}Hz</span></div>
      `;

      // สร้างปุ่มกดฟังเสียง 5 ระดับวรรณยุกต์
      toneGrid.innerHTML = "";
      TONE_SPECS.forEach((tone, idx) => {
        const card = document.createElement("button");
        card.className = "flex flex-col items-center justify-center p-2.5 bg-slate-950 border border-slate-800 hover:border-cyan-500 rounded-xl transition active:scale-95 text-center gap-1 shadow";
        card.onclick = () => playSingleTone(idx);
        card.innerHTML = `
          <span class="text-xs font-bold text-cyan-400">${tone.name}</span>
          <span class="text-[10px] text-slate-400 font-mono">${tone.startFreq.toFixed(0)}${tone.startFreq !== tone.endFreq ? '→' + tone.endFreq.toFixed(0) : ''}Hz</span>
          <span class="text-emerald-400 text-xs">🔊</span>
        `;
        toneGrid.appendChild(card);
      });

      profileBox.classList.remove('hidden');
      staffSection.classList.remove('hidden');
      toneGrid.classList.remove('hidden');

      renderStaff5Tones();
    }

    // Formant Synthesizer Engine (จำลองเสียงสระ + Pitch Slide)
    function playSingleTone(toneIndex, startTimeOffset = 0) {
      if (!currentAnalysis) return;
      const tone = TONE_SPECS[toneIndex];

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime + startTimeOffset;
      const duration = 0.5;

      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';

      osc.frequency.setValueAtTime(tone.startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(tone.endFreq, now + duration);

      // Formant Filters F1 & F2
      const f1 = audioCtx.createBiquadFilter();
      f1.type = 'bandpass';
      f1.frequency.setValueAtTime(currentAnalysis.formants.f1, now);
      f1.Q.setValueAtTime(4.5, now);

      const f2 = audioCtx.createBiquadFilter();
      f2.type = 'bandpass';
      f2.frequency.setValueAtTime(currentAnalysis.formants.f2, now);
      f2.Q.setValueAtTime(5.5, now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.35);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(f1);
      osc.connect(f2);
      f1.connect(gain);
      f2.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + duration);
    }

    // เล่นเรียงลำดับ 5 วรรณยุกต์
    function playSequence() {
      TONE_SPECS.forEach((_, idx) => {
        playSingleTone(idx, idx * 0.6);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      handleAnalyzeAll();
    });
  </script>
</body>
</html>
