<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Tone TTS Research & Analysis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 flex flex-col gap-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-3">
      <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
        <span>🔊</span> ทดสอบสังเคราะห์เสียง (TTS)
      </h1>
      <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-1 rounded">Offline Engine</span>
    </div>

    <!-- Text Input Area -->
    <div class="flex flex-col gap-1">
      <label class="text-xs text-slate-400">ข้อความภาษาไทยที่ต้องการทดสอบ:</label>
      <textarea 
        id="textInput" 
        rows="3" 
        placeholder="พิมพ์คำ เช่น กา, ข่า, ค้า, ปา..." 
        class="bg-slate-900 border border-slate-700 rounded-lg p-3 text-base text-slate-100 focus:outline-none focus:border-cyan-500 transition resize-none"
      >กา</textarea>
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button 
        id="btnPlay" 
        onclick="playToneSound()" 
        class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg transition"
      >
        <span>📢</span> กดฟังเสียง
      </button>

      <button 
        id="btnAnalyze" 
        onclick="handleAnalyze()" 
        class="flex items-center justify-center gap-2 bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg transition"
      >
        <span>⚡</span> วิเคราะห์สัทศาสตร์
      </button>
    </div>

    <!-- Result Box -->
    <div id="resBox" class="hidden rounded-xl p-4 text-sm transition-all border leading-relaxed bg-slate-900 border-cyan-800 text-slate-100"></div>

    <!-- Close Button -->
    <button 
      id="btnClose" 
      onclick="resetResult()" 
      class="hidden w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-lg text-sm transition"
    >
      ปิด
    </button>
  </div>

  <script>
    const HIGH_CLASS = new Set(["ข","ฃ","ฉ","ฐ","ถ","ผ","ฝ","ศ","ษ","ส","ห"]);
    const MID_CLASS = new Set(["ก","จ","ด","ต","บ","ป","อ","ฎ","ฏ"]);
    const LOW_CLASS = new Set(["ค","ฅ","ฆ","ง","ช","ซ","ฌ","ญ","ฑ","ฒ","ณ","ท","ธ","น","พ","ฟ","ภ","ม","ย","ร","ล","ว","ฬ","ฮ"]);

    let currentToneFreq = 261.63; // F0 ค่าเริ่มต้น (Hz)

    function analyzeThaiPhonetics(word) {
      if (!word) return null;
      
      // สกัดพยัญชนะต้นตัวแรก
      let initial = "";
      for (const char of word) {
        if (HIGH_CLASS.has(char) || MID_CLASS.has(char) || LOW_CLASS.has(char)) {
          initial = char;
          break;
        }
      }

      let consonantClass = "ไม่ระบุ";
      let toneName = "สามัญ (Mid)";
      let targetFreq = 261.63; // C4

      if (HIGH_CLASS.has(initial)) {
        consonantClass = "อักษรสูง";
        toneName = "จัตวา (Rising)";
        targetFreq = 293.66; // D4
      } else if (MID_CLASS.has(initial)) {
        consonantClass = "อักษรกลาง";
        toneName = "สามัญ (Mid/Level)";
        targetFreq = 261.63; // C4
      } else if (LOW_CLASS.has(initial)) {
        consonantClass = "อักษรต่ำ";
        toneName = "สามัญ (Mid/Level)";
        targetFreq = 246.94; // B3
      }

      return {
        word: word,
        initial: initial || "-",
        consonantClass: consonantClass,
        toneName: toneName,
        pitchTarget: `${targetFreq.toFixed(2)} Hz`,
        freq: targetFreq
      };
    }

    function handleAnalyze() {
      const text = document.getElementById('textInput').value.trim();
      if (!text) {
        showStatus('กรุณาพิมพ์ข้อความที่ต้องการวิเคราะห์', 'error');
        return;
      }

      const result = analyzeThaiPhonetics(text);
      currentToneFreq = result.freq;

      const resultHtml = `
        <div class="space-y-1.5">
          <p><strong>คำที่วิเคราะห์:</strong> <span class="text-cyan-300 font-bold">${result.word}</span></p>
          <p><strong>พยัญชนะต้น:</strong> ${result.initial} (${result.consonantClass})</p>
          <p><strong>ระดับเสียงวรรณยุกต์:</strong> <span class="text-amber-400 font-semibold">${result.toneName}</span></p>
          <p><strong>Target Pitch (F0):</strong> <span class="text-emerald-400 font-mono font-bold">${result.pitchTarget}</span></p>
        </div>
      `;
      showStatus(resultHtml, 'success');
    }

    function playToneSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(currentToneFreq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    function showStatus(htmlContent, type) {
      const resBox = document.getElementById('resBox');
      const btnClose = document.getElementById('btnClose');
      
      resBox.className = "rounded-xl p-4 text-sm transition-all border leading-relaxed";

      if (type === 'error') {
        resBox.classList.add('bg-red-950/80', 'border-red-800', 'text-red-200');
      } else {
        resBox.classList.add('bg-slate-900', 'border-cyan-800', 'text-slate-100');
      }

      resBox.innerHTML = htmlContent;
      resBox.classList.remove('hidden');
      btnClose.classList.remove('hidden');
    }

    function resetResult() {
      document.getElementById('resBox').classList.add('hidden');
      document.getElementById('btnClose').classList.add('hidden');
    }
  </script>
</body>
</html>
