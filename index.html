<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Panel | theloydas.com</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; border-radius: 12px; padding: 28px; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; text-align: center; }
    .hidden { display: none; }
    input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 12px; font-size: 1rem; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .error-msg { color: #f87171; font-size: 0.875rem; margin-bottom: 10px; display: none; }
    .nav-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .item-box { background: #334155; padding: 16px; border-radius: 8px; text-align: center; color: #e2e8f0; text-decoration: none; font-weight: 500; border: 1px solid transparent; }
    .item-box:hover { border-color: #38bdf8; background: #3b4d66; }
  </style>
</head>
<body>

  <!-- กล่องกรอกรหัสผ่าน -->
  <div id="login-box" class="card">
    <h1>เข้าสู่ระบบแผงควบคุม</h1>
    <p style="text-align: center; color: #94a3b8; font-size: 0.9rem;">กรุณากรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
    <div id="error" class="error-msg">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</div>
    <input type="password" id="passInput" placeholder="รหัสผ่าน" onkeypress="if(event.key==='Enter') checkPass()" />
    <button onclick="checkPass()">เข้าสู่ระบบ</button>
  </div>

  <!-- หน้าแดชบอร์ดหลัก -->
  <div id="dashboard-box" class="card hidden">
    <h1>แผงควบคุมหลัก (Control Panel)</h1>
    <p style="text-align: center; color: #94a3b8;">ยินดีต้อนรับเข้าสู่ระบบจัดการ theloydas.com</p>
    
    <div class="nav-box">
      <div class="item-box">⚙️ จัดการระบบ</div>
      <div class="item-box">📊 สถานะ Cloudflare</div>
      <div class="item-box">📁 คลังโปรเจกต์</div>
      <div class="item-box">🔗 เชื่อมต่อ API</div>
    </div>

    <button style="margin-top: 24px; background: #475569;" onclick="logout()">ออกจากระบบ</button>
  </div>

  <script>
    // ตั้งรหัสผ่านที่ต้องการ (สามารถเปลี่ยนคำว่า AdminPass1234 ได้)
    const SECRET_KEY = "AdminPass1234";

    function checkPass() {
      const input = document.getElementById("passInput").value;
      if (input === SECRET_KEY) {
        sessionStorage.setItem("auth_logged_in", "true");
        showDashboard();
      } else {
        document.getElementById("error").style.display = "block";
      }
    }

    function showDashboard() {
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("dashboard-box").classList.remove("hidden");
    }

    function logout() {
      sessionStorage.removeItem("auth_logged_in");
      location.reload();
    }

    // ตรวจสอบสถานะการล็อกอินเดิม
    if (sessionStorage.getItem("auth_logged_in") === "true") {
      showDashboard();
    }
  </script>
</body>
</html>
