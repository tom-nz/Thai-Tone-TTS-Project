<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Panel</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { background: transparent; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h1 { font-size: 1.25rem; color: #38bdf8; text-align: center; margin-bottom: 6px; }
    .subtext { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-bottom: 20px; }
    .hidden { display: none; }
    
    .nav-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .item-box { background: #334155; padding: 16px 10px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; border: 1px solid #475569; font-size: 0.85rem; }
    .item-box:hover { background: #38bdf8; color: #0f172a; transform: translateY(-2px); }
    
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 90%; max-width: 360px; border: 1px solid #475569; text-align: center; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; margin: 10px 0; outline: none; }
    .btn-main { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
    .btn-main:hover { background: #0369a1; }
    .btn-logout { width: 100%; margin-top: 16px; padding: 10px; background: none; border: 1px solid #475569; color: #94a3b8; cursor: pointer; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- กล่องล็อกอิน -->
  <div id="login-box" class="card">
    <h1>เข้าสู่ระบบแผงควบคุม</h1>
    <p class="subtext">กรุณากรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
    <input type="password" id="passInput" placeholder="รหัสผ่าน" onkeypress="if(event.key==='Enter') checkPass()" />
    <button class="btn-main" onclick="checkPass()">เข้าสู่ระบบ</button>
  </div>

  <!-- กล่องแผงควบคุม -->
  <div id="dashboard-box" class="card hidden">
    <h1>แผงควบคุมหลัก (Control Panel)</h1>
    <p class="subtext">ยินดีต้อนรับสู่ระบบจัดการ theloydas.com</p>
    
    <div class="nav-box">
      <div class="item-box" onclick="showSystemStatus()">⚙️ จัดการระบบ</div>
      <div class="item-box" onclick="window.open('https://dash.cloudflare.com', '_blank')">📊 สถานะ Cloudflare</div>
      <div class="item-box" onclick="window.open('https://github.com/tom-nz/Thai-Tone-TTS-Project', '_blank')">📁 คลังโปรเจกต์</div>
      <div class="item-box" onclick="openApiModal()">🔗 เชื่อมต่อ API</div>
    </div>
    <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
  </div>

  <!-- Popup Modal -->
  <div id="modal" class="modal">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <script>
    const SECRET_KEY = "AdminPass1234";
    
    function checkPass() {
      if(document.getElementById("passInput").value === SECRET_KEY) {
        sessionStorage.setItem("auth", "true");
        location.reload();
      } else {
        alert("รหัสผ่านไม่ถูกต้อง!");
      }
    }
    
    if (sessionStorage.getItem("auth") === "true") {
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("dashboard-box").classList.remove("hidden");
    }

    function showSystemStatus() {
      showModal(`
        <h3 style="color:#38bdf8; margin-bottom:8px;">สถานะระบบ</h3>
        <p style="margin:12px 0; font-size:0.9rem; color:#cbd5e1;">✅ Cloudflare Pages: เชื่อมต่อปกติ<br>✅ Core Version: 1.0.0</p>
        <button class="btn-main" onclick="closeModal()">ปิด</button>
      `);
    }

    function openApiModal() {
      const currentKey = localStorage.getItem("my_api_key") || "";
      showModal(`
        <h3 style="color:#38bdf8; margin-bottom:8px;">ตั้งค่า API Key</h3>
        <input type="text" id="apiKey" placeholder="วาง API Key ที่นี่..." value="${currentKey}">
        <button class="btn-main" onclick="saveApi()">บันทึก</button>
      `);
    }

    function saveApi() {
      const key = document.getElementById("apiKey").value;
      localStorage.setItem("my_api_key", key);
      alert("บันทึก API Key สำเร็จ!");
      closeModal();
    }

    function showModal(html) {
      document.getElementById("modal").style.display = "flex";
      document.getElementById("modal-content").innerHTML = html;
    }
    
    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
    
    function logout() {
      sessionStorage.removeItem("auth");
      location.reload();
    }
  </script>
</body>
</html>
